[project]
name = "health-assistant"
version = "0.1.0"
description = "Domain model for evidence-informed personal health planning with verified external execution."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    # IANA time-zone database for platforms without a system tzdata (Windows).
    "tzdata>=2025.1; sys_platform == 'win32'",
    "SQLAlchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "C4", "DTZ", "E", "ERA", "F", "I", "N",
    "PL", "PTH", "RET", "RUF", "S", "SIM", "T20", "TID", "UP", "W",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["health_assistant"]

[tool.ruff.lint.pylint]
# Domain entry points take keyword-only parameters, so the positional-argument
# confusion that PLR0913 guards against does not apply to them.
max-args = 8

[tool.mypy]
python_version = "3.12"
# Alembic generates revision scripts from a template that has no annotations.
exclude = ["^migrations/versions/"]
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires a PostgreSQL database named by HEALTH_ASSISTANT_TEST_DATABASE_URL",
]
